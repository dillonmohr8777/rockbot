name: Required checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rockbot-checks:
    name: Rockbot checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:knowledge
      - run: npm run build
